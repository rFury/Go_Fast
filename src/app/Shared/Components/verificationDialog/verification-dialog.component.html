<div class="fixed left-0 sm:left-0 md:left-[224px] lg:left-[608px] right-0 top-0 bottom-0 h-auto flex justify-center items-center bg-black/50 z-999 transition-all duration-300 ease-out">
<!-- verification-dialog.component.html -->
<div class="bg-white rounded-xl shadow-2xl w-120 h-auto mx-auto overflow-hidden main">
  <!-- Header -->
  <div class="bg-gradient-to-r from-blue-500 to-purple-600 px-6 py-2">
    <h2 mat-dialog-title class="text-white text-xl font-semibold text-center m-0">
      Enter Verification Code
    </h2>
    <p class="text-blue-100 text-md text-center mt-1 mb-0">
      We've sent a 6-digit code to your email address
    </p>
  </div>

  <!-- Content -->
  <div mat-dialog-content class="px-6 py-4">
    <div class="code-input-container mb-6">
      <code-input
        [codeLength]="6"
        (codeChanged)="onCodeCompleted($event)"
        [isCodeHidden]="false"
        [code]="code"
        [isNonDigitsCode]="false"
        class="flex justify-center space-x-2"
      ></code-input>
    </div>
    
    <!-- Progress indicator -->
    <div class="w-full bg-gray-200 rounded-full h-1 mb-4">
      <div 
        class="bg-gradient-to-r from-blue-500 to-purple-600 h-1 rounded-full transition-all duration-300 ease-out"
        [style.width.%]="(code.length / 6) * 100">
      </div>
    </div>
    
    <!-- Status message -->
    <div class="text-center">
      <p class="text-md text-gray-600" *ngIf="code.length < 6">
        {{ 6 - code.length }} digits remaining
      </p>
      <p class="text-sm text-green-600 flex items-center justify-center" *ngIf="code.length === 6">
        <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
        </svg>
        Code complete!
      </p>
    </div>
    
    <!-- Resend option -->
    <div class="text-center">
      <button 
        class="text-indigo-600 hover:text-indigo-800 text-md font-medium transition-colors duration-200"
        (click)="resendCode()"
        type="button"
      >
        Didn't receive the code? Resend
      </button>
    </div>
  </div>

  <!-- Actions -->
  <div mat-dialog-actions class="px-6 py-4 bg-gray-50 flex justify-between items-center space-x-3">
    <button 
      mat-button 
      (click)="cancel()"
      class="px-4 py-2 text-gray-600 hover:text-gray-800 font-medium transition-colors duration-200"
    >
      Cancel
    </button>
    <button 
      mat-flat-button 
      color="primary" 
      [disabled]="code.length !== 6" 
      (click)="verify()"
      class="px-6 py-2 bg-gradient-to-r from-blue-500 to-purple-600 text-white font-medium rounded-lg shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 transform hover:scale-105 disabled:hover:scale-100"
    >
    @if(!isVerifying){
      <span>Verify Code</span>
    }@else{
      <span class="flex items-center">
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Verifying...
      </span>
    }
    </button>
  </div>
</div>
</div>
