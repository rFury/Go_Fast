<card class="flex items-center max-w-80 w-full p-2 justify-around" @shake>
  <mat-icon class="icon-size-12" [svgIcon]="getIcon(data.type)"></mat-icon>
  <div class="flex flex-col">
    <div class="text-2xl font-semibold leading-tight text-gray-900">{{ data.title }}</div>
    <div class="text-md text-secondary">{{data.message}}</div>
  </div>
  @if (data.showActions) {
    <div class="flex items-center flex-col gap-1">
      <button class="px-1 sm:px-4 min-w-4  text-white rounded-full hover:bg-green-100" mat-icon-button (click)="onAccept()">
        <mat-icon class="icon-size-5 text-green-500" [svgIcon]="'heroicons_solid:check'"></mat-icon>
      </button> <button class=" px-1 sm:px-4 min-w-4 rounded-full" mat-icon-button [color]="'warn'"
        (click)="onDecline()">
        <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:x-mark'"></mat-icon>
      </button>
    </div>
    }
</card>
