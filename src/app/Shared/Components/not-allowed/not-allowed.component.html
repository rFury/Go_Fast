    <div class="min-h-screen flex items-center justify-center p-4 bg-gray-50 dark:bg-gray-900">
      <mat-card class="max-w-md w-full text-center p-8 shadow-xl">
        <div class="space-y-6">
          <!-- Icon -->
          <div class="text-red-500 mx-auto">
            <mat-icon class="icon-size-20" [svgIcon]="'heroicons_outline:lock-closed'"></mat-icon>
          </div>
  
          <!-- Content -->
          <div class="space-y-2">
            <h1 class="text-4xl font-bold text-gray-800 dark:text-gray-200">403</h1>
            <h2 class="text-2xl font-semibold text-gray-700 dark:text-gray-300">
              Access Denied
            </h2>
            <p class="text-gray-500 dark:text-gray-400">
              You don't have permission to view these features. Please contact your administrator 
              or return to the previous page.
            </p>
          </div>
  
          <!-- Action Button -->
          <button 
            mat-raised-button
            color="warn"
            class="w-full sm:w-auto"
            [routerLink]="['/']"
          >
            <mat-icon [svgIcon]="'heroicons_outline:arrow-left'" class="mr-2"></mat-icon>
            Return to Safety
          </button>
        </div>
      </mat-card>
    </div>
