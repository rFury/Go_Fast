<section class="bg-gray-50 dark:bg-gray-900 p-3 sm:p-5">
    <div class="mx-auto max-w-screen-xl px-4 lg:px-12">
      <div class="bg-white dark:bg-gray-800 relative shadow-md sm:rounded-lg overflow-hidden">
        <div class="flex flex-col md:flex-row items-center justify-between space-y-3 md:space-y-0 md:space-x-4 p-4">
          <mat-form-field appearance="outline" class="w-full md:w-1/2">
            <input matInput placeholder="Search">
            <mat-icon matPrefix class="text-gray-500">search</mat-icon>
          </mat-form-field>

          <div class="w-full md:w-auto flex flex-col md:flex-row space-y-2 md:space-y-0 items-stretch md:items-center justify-end md:space-x-3">
            <button (click)="openDialog(-1)" mat-raised-button color="primary" class="flex items-center">
              <mat-icon>add</mat-icon>
              Add task
            </button>
            <mat-menu #filterMenu="matMenu">
              <div class="p-3 w-48">
                <h6 class="mb-3 text-sm font-medium">Choose brand</h6>
                <mat-selection-list>
                  @for (imp of Importance; track imp) {
                    <mat-list-option [value]="imp">
                      {{ imp.name }} ({{ imp.count }})
                    </mat-list-option>
                  }
                </mat-selection-list>
              </div>
            </mat-menu>
            <button mat-stroked-button [matMenuTriggerFor]="filterMenu" class="dark:text-white">
              <mat-icon>filter_list</mat-icon>
              Filter 
            </button>
          </div>
        </div>
  
        <div class="overflow-x-auto">
          <table mat-table [dataSource]="dataSource" class="w-full">
            <ng-container matColumnDef="taskName">
              <th mat-header-cell *matHeaderCellDef>task Name</th>
              <td mat-cell *matCellDef="let element">{{ element.taskName }}</td>
            </ng-container>
  
            <ng-container matColumnDef="taskDate">
              <th mat-header-cell *matHeaderCellDef>task Date</th>
              <td mat-cell *matCellDef="let element">{{ element.taskDate }}</td>
            </ng-container>
  
            <ng-container matColumnDef="taskDuration">
              <th mat-header-cell *matHeaderCellDef>Duration</th>
              <td mat-cell *matCellDef="let element">{{ element.taskDuration+'h' }}</td>
            </ng-container>
  
            <ng-container matColumnDef="importance">
              <th mat-header-cell *matHeaderCellDef>importance</th>
              <td mat-cell *matCellDef="let element">{{ element.importance }}</td>
            </ng-container>
            
  
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef></th>
              <td mat-cell *matCellDef="let element;let index = index">
                <mat-menu #actionMenu="matMenu">
                  <button mat-menu-item (click)="openDialog(index)">Edit</button>
                  <button mat-menu-item (click)="deleteTask(element._id)" class="text-red-600">Delete</button>
                </mat-menu>
                <button mat-icon-button [matMenuTriggerFor]="actionMenu">
                  <mat-icon>more_vert</mat-icon>
                </button>
              </td>
            </ng-container>
  
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
  
        <mat-paginator [pageSizeOptions]="[5, 10, 20]" 
                     showFirstLastButtons
                     class="bg-gray-50 dark:bg-gray-800">
        </mat-paginator>
      </div>
    </div>
  </section>
