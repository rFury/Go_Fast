<fuse-loading-bar></fuse-loading-bar>
<div class="flex h-screen ">
    <!-- Navigation -->
    <fuse-vertical-navigation class="dark flex-none max-w-56 min-w-56" [mode]="isScreenSmall ? 'over' : 'side'"
        [name]="'mainNavigation'" [navigation]="navigation" [opened]="!isScreenSmall" [who]="'user'">
        <!-- Navigation header hook -->
        <ng-container fuseVerticalNavigationContentHeader>
            <div class="flex items-center h-20 p-2 mt-5 mb-10" gap-2>
                <img class="w-full" src="van+name.logo.png">
            </div>
        </ng-container>
        <!-- Navigation footer hook -->
        <ng-container fuseVerticalNavigationFooter>
            <!-- User -->
            <div class="flex items-center w-full px-4 py-8 border-t">
                <user></user>
                @if(user){
                    <div class="flex flex-col w-full ml-4 overflow-hidden">
                        <div
                            class="w-full whitespace-nowrap text-ellipsis overflow-hidden leading-normal text-current opacity-80">
                            {{user.first_name}} {{user.last_name}}
                        </div>
                        <div
                            class="w-full mt-0.5 whitespace-nowrap text-sm text-ellipsis overflow-hidden leading-normal text-current opacity-50">
                            {{user.email}}
                        </div>
                    </div>
                }
            </div>
        </ng-container>
    </fuse-vertical-navigation>


    <!-- Wrapper -->
    <div class="flex flex-col flex-1 min-w-0 relative">
        <!-- Header -->
        <div
            class="relative flex flex-0 items-center w-full h-16 px-4 md:px-6 z-49 shadow-none dark:border-b bg-transparent print:hidden">

            <ng-template #separatorTemplate>
                <mat-icon svgIcon="heroicons_outline:chevron-right"></mat-icon>
            </ng-template>
            <!-- Components -->
            <div class="flex items-center pl-2 ml-auto space-x-0.5 sm:space-x-2">
                <notifications class="bg-gray-400 bg-opacity-50 backdrop-blur-sm rounded-full"></notifications>
                <user class="bg-gray-400 bg-opacity-50 backdrop-blur-sm rounded-full"></user>
            </div>
        </div>
        <!-- Content -->
        <div class="absolute inset-0 overflow-auto">
            @if (true) {
            @if(isLoading){
            <div class="flex flex-1 justify-center items-center">
                <mat-progress-spinner [diameter]="45" mode="indeterminate">
                </mat-progress-spinner>
            </div>
            }@else {
            <router-outlet></router-outlet>
            }
            }
        </div>

    </div>
</div>
