<div class="flex justify-center items-center h-screen">
    <mat-card class="p-6 w-96 shadow-lg">
      <h2 class="text-xl font-semibold mb-4">New Password</h2>
      <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
        <mat-form-field class="w-full">
          <mat-label>New Password</mat-label>
          <input matInput type="password" formControlName="password" (input)="onInput($event)" />
          <mat-hint align="end">{{value().length}}/8</mat-hint>
        </mat-form-field>
        <mat-form-field class="w-full">
          <mat-label>Confirm Password</mat-label>
          <input matInput type="password" formControlName="confirmPassword" />
          <mat-error *ngIf="passwordForm.hasError('mismatch')">Passwords do not match</mat-error>
        </mat-form-field>
        <button mat-raised-button color="primary" class="w-full mt-4" type="submit">Change</button>
      </form>
    </mat-card>
  </div>
