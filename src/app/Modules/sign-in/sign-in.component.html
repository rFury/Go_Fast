<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <mat-card class="w-full max-w-md">
      <mat-card-header class="justify-center">
        <mat-card-title class="text-2xl font-bold">Sign In</mat-card-title>
      </mat-card-header>
  
      <mat-card-content>
        <form class="space-y-4">
          <mat-form-field class="w-full">
            <mat-label>Email</mat-label>
            <input matInput type="email" required>
          </mat-form-field>
  
          <mat-form-field class="w-full">
            <mat-label>Password</mat-label>
            <input matInput type="password" required>
          </mat-form-field>
  
          <button 
            mat-raised-button 
            color="primary"
            class="w-full"
          >
            Sign In
          </button>
        </form>
  
        <div class="mt-4 text-center">
          <span class="text-gray-600">Don't have an account? </span>
          <a routerLink="/signup" class="text-blue-600 hover:underline">Sign Up</a>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
