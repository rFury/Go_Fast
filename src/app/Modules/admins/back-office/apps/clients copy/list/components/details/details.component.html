@if (user) {
<div class="flex flex-col flex-1 min-w-0 bg-card dark:bg-transparent">

    <form class="w-full" #myForm="ngForm" ngForm="ngForm">
        <!-- Header -->
        <div
            class="flex flex-wrap md:flex-nowrap items-center justify-between px-4 py-3 border-b bg-white rounded-md shadow-sm">

            <!-- Title -->
            <div class="flex items-center gap-2 w-full md:w-1/2 mb-2 md:mb-0">
                <div class="text-2xl md:text-3xl font-bold text-indigo-700">
                    {{ 'Details client' }}
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-2 w-full md:w-auto justify-end">

                <!-- Delete button -->
                <button mat-flat-button [color]="'warn'" (click)="deleteOne()" type="button"
                    class="flex items-center gap-1" *hasPermission="['clients','delete']">
                    <mat-icon>delete</mat-icon>
                    <span>Delete</span>
                </button>

                <!-- Update button -->
                <button mat-flat-button [color]="'primary'" type="submit" (click)="updateOne()"
                    class="flex items-center gap-1 hover:bg-indigo-600" *hasPermission="['clients','update']">
                    <mat-icon>edit</mat-icon>
                    <span>Update</span>
                </button>
            </div>

        </div>
        <!-- Main -->
        <div class="flex flex-col flex-auto h-[calc(100vh-8rem)] bg-gray-100  overflow-y-auto">
            <div class="flex flex-col mb-6 w-full">
                <div class="grid sm:grid-cols-9 gap-6 p-3">
                    <!-- name -->
                    <div class="sm:col-span-3">
                        <mat-form-field class="fuse-mat-no-subscript fuse-mat-emphasized-affix w-full">
                            <mat-label class="capitalize">{{ 'name' }}</mat-label>
                            <input [value]="user.first_name+' '+user.last_name" matInput name="name" type="text"
                                readonly />
                        </mat-form-field>

                    </div>

                    <!-- email -->
                    <div class="sm:col-span-3">
                        <mat-form-field class="fuse-mat-no-subscript fuse-mat-emphasized-affix w-full">
                            <mat-label class="capitalize">{{ 'email' }}</mat-label>
                            <input [(ngModel)]="user.email" matInput name="email" type="text" readonly />
                        </mat-form-field>
                    </div>

                    <!-- phone -->
                    <div class="sm:col-span-3">
                        <mat-form-field class="fuse-mat-no-subscript fuse-mat-emphasized-affix w-full">
                            <mat-label class="capitalize">{{ 'phone' }}</mat-label>
                            <input [(ngModel)]="user.phone" matInput name="phone" type="tel" readonly />
                        </mat-form-field>
                    </div>

                    <!-- city -->
                    <div class="sm:col-span-3">
                        <mat-form-field class="fuse-mat-no-subscript fuse-mat-emphasized-affix w-full">
                            <mat-label class="capitalize">{{ 'city' }}</mat-label>
                            <input [(ngModel)]="user.city.gouvernorat" matInput name="city" type="text" readonly />
                        </mat-form-field>
                    </div>

                    <!-- type -->
                    <div class="sm:col-span-3">
                        <mat-form-field class="fuse-mat-no-subscript fuse-mat-emphasized-affix w-full">
                            <mat-label class="capitalize">{{ 'type' }}</mat-label>
                            <input [(ngModel)]="user.accountType" matInput name="type" type="text" readonly />
                        </mat-form-field>
                    </div>

                    <!-- password -->
                    @if(user.new.value){
                    <div class="sm:col-span-3">
                        <mat-form-field class="fuse-mat-no-subscript fuse-mat-emphasized-affix w-full">
                            <mat-label class="capitalize">{{ 'password' }}</mat-label>
                            <input [(ngModel)]="user.new.password" matInput name="password" type="text" readonly />
                        </mat-form-field>
                    </div>
                    }





                </div>
            </div>
        </div>
    </form>
</div>
}
