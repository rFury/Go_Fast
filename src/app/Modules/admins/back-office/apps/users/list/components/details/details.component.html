@if (user) {
    <div class="flex flex-col flex-1 min-w-0 bg-card dark:bg-transparent">

        <form class="w-full" #myForm="ngForm" ngForm="ngForm">
            <!-- Header -->
            <div class="flex flex-row md:gap-4 items-center px-4 h-fit md:h-14  border-b bg-gray-900">
                <div class=" flex gap-2 w-1/4 text-4xl font-extrabold text-white ">
                    <span>{{ 'Details' }}</span>
                    <span class="hidden sm:flex">{{ 'User' }}</span>
                </div>
                <div class="flex w-3/4 items-center justify-end">
                    <!-- clear project button -->
                    <button
                        class="mr-2 text-red-500 hover:bg-red-500 hover:text-gray-900 transition-all duration-400"
                        mat-stroked-button
                        type="button"
                        (click)="deleteOne()"
                    >
                        <span class="ml-2 mr-1">{{ 'Delete' }}</span>
                    </button>
                    <!-- save project button -->
                    <button
                        class="mr-2 text-blue-500 hover:bg-blue-500 hover:text-gray-900 transition-all duration-400"
                        mat-stroked-button
                        type="submit"
                        (click)="updateOne()"
                    >
                        <span class="ml-2 mr-1">{{ 'Update' }}</span>
                    </button>
                </div>
            </div>
            <!-- Main -->
            <div class="flex flex-col flex-auto h-[calc(100vh-8rem)] bg-gray-100  overflow-y-auto">
                <div class="flex flex-col mb-6 w-full">
                    <div class="grid sm:grid-cols-9 gap-6 p-3">
                        <!-- name -->
                        <div class="sm:col-span-3">
                            <mat-form-field class="fuse-mat-no-subscript fuse-mat-emphasized-affix w-full">
                                <mat-label class="capitalize">{{ 'name' }}</mat-label>
                                <input [value]="user.first_name+' '+user.last_name" matInput name="name" type="text" readonly />
                            </mat-form-field>

                        </div>
                        
                        <!-- email -->
                        <div class="sm:col-span-3">
                            <mat-form-field class="fuse-mat-no-subscript fuse-mat-emphasized-affix w-full">
                                <mat-label class="capitalize">{{ 'email' }}</mat-label>
                                <input [(ngModel)]="user.email" matInput name="email" type="text" readonly />
                            </mat-form-field>

                        </div>
                        <!-- group -->
                        @if (this.user.type==='super') {
                            <div class="sm:col-span-3">
                                <mat-form-field class="fuse-mat-no-subscript fuse-mat-emphasized-affix w-full">
                                    <mat-label class="capitalize">{{ 'group' }}</mat-label>
                                    <input  matInput type="text" value="Super Admin" name="group" readonly />
                                </mat-form-field>
                            </div>

                        }@else {
                        <div class="sm:col-span-3">
                            <mat-form-field class="fuse-mat-no-subscript fuse-mat-emphasized-affix w-full">
                                <mat-label class="capitalize">{{ 'group' }}</mat-label>
                                <mat-select
                                    placeholder="select group"
                                    [(ngModel)]="user.groupsId"
                                    name="groupsId"
                                    disabled
                                >
                                    @for (item of listGroups; track item) {
                                        <mat-option [value]="item">
                                            <div class="font-medium items-center flex flex-row">
                                                        <span class="">
                                                          {{ item.label }}
                                                        </span>
                                            </div>
                                        </mat-option>
                                    }
                                </mat-select>
                            </mat-form-field>


                        </div>
                    }
                    </div>
                </div>
            </div>
        </form>
    </div>
}
