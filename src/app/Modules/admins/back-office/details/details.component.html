<div class="w-[calc(100vw-280px)] h-[calc(100vh-5rem)]">
  <div class="w-full h-full  relative">
    <div class="map" id="map" class="match-parent"></div>
    <div class="absolute flex items-center justify-center top-4 right-4 z-999 w-8 h-8 bg-gray-100 rounded-full">
      <mat-icon (click)="switchMap($event)" class="icon-size-7 cursor-pointer z-99 text-blue-400 rounded-full"
        [svgIcon]="'heroicons_solid:globe'"></mat-icon>
    </div>
  </div>
</div>
