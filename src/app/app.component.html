<!-- app.component.html -->
<div class="relative min-h-screen">
  <!-- Background -->
  <div class="absolute inset-0 -z-10 bg-gradient-to-br from-blue-600 via-teal-500 to-cyan-400">
    <!-- Abstract delivery-themed SVG background -->
    <svg viewBox="0 0 960 540" class="w-full h-full opacity-10" xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink">
      <!-- Abstract truck shape -->
      <path d="M200 400 L300 350 L500 350 L600 400 L550 450 L250 450 Z" fill="none" stroke="currentColor"
        stroke-width="2" />
      <!-- Package icons -->
      <g transform="translate(100 200)">
        <rect x="0" y="0" width="60" height="40" fill="none" stroke="currentColor" />
        <line x1="20" y1="0" x2="20" y2="40" stroke="currentColor" />
        <line x1="40" y1="0" x2="40" y2="40" stroke="currentColor" />
      </g>
      <!-- Moving dots pattern -->
      <!-- Moving dots pattern -->
      <!-- Moving dots pattern -->
      <g transform="translate(400 100)" stroke="currentColor">
        <ng-container *ngFor="let idx of generateArray(15)">
          <circle [attr.cx]="(idx % 5) * 80" [attr.cy]="floor(idx / 5) * 80" r="2" fill="currentColor" />
        </ng-container>
      </g>


      <!-- Global logistics lines -->
      <path d="M800 100 Q850 150 800 200 T760 300" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-dasharray="4 4" />
    </svg>
  </div>
  <!-- Your content -->
  <router-outlet></router-outlet>
</div>
